name: iOS player unsigned build

# ponytail: rung 2 - reuse v2rayForPhone's manual macOS build/artifact workflow.
on:
  workflow_dispatch:
  push:
    branches: [build/ios-player]
    paths:
      - .github/workflows/player-ios.yml
      - apps/mobile/lib/main_player.dart
      - apps/mobile/lib/screens/torrent_player_screen.dart
      - apps/mobile/torrent_engine/**
      - apps/mobile/ios-player/**
      - scripts/build-player-torrent-ios.sh
      - scripts/configure-player-ios.rb
      - scripts/patch-player-flutter-test.py
      - scripts/package-player-ios.py

permissions:
  contents: read

concurrency:
  group: player-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Select Xcode with iOS 26 support
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache-dependency-path: apps/mobile/torrent_engine/go.sum
      - name: Verify embedded BT engine
        working-directory: apps/mobile/torrent_engine
        run: go test -mod=mod -race -tags 'nosqlite,disable_libutp' ./engine -v -timeout 4m
      - name: Compile native BT engine
        run: bash scripts/build-player-torrent-ios.sh
      - name: Install Flutter 3.35.7
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/player-flutter"
          python3 scripts/patch-player-flutter-test.py "$RUNNER_TEMP/player-flutter/packages/flutter_tools/lib/src/ios/simulators.dart"
          echo "$RUNNER_TEMP/player-flutter/bin" >> "$GITHUB_PATH"
      - name: Generate independent player project
        run: |
          flutter --version
          flutter create --platforms=ios --org com.coderemote --project-name torrent_player runtime/player-ios
          cp apps/mobile/lib/screens/torrent_player_screen.dart runtime/player-ios/lib/player_screen.dart
          cp apps/mobile/lib/main_player.dart runtime/player-ios/lib/main.dart
          sed -i '' "s@screens/torrent_player_screen.dart@player_screen.dart@" runtime/player-ios/lib/main.dart
          cd runtime/player-ios
          flutter pub add http:^1.2.0 video_player:^2.9.2
          flutter pub add --dev integration_test --sdk=flutter
          mkdir -p integration_test
          cp ../../apps/mobile/ios-player/standalone_test.dart integration_test/standalone_test.dart
          cp ../../apps/mobile/ios-player/player_lifecycle_test.dart test/player_lifecycle_test.dart
          sed -i '' 's@package:coderemote_mvp/screens/torrent_player_screen.dart@package:torrent_player/player_screen.dart@' test/player_lifecycle_test.dart
          cp ../../apps/mobile/ios-player/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ../../apps/mobile/ios-player/TorrentCore.h ios/Runner/TorrentCore.h
          echo '#import "TorrentCore.h"' >> ios/Runner/Runner-Bridging-Header.h
          mkdir -p ios/TorrentNative
          cp ../player-torrent-native/iphoneos.a ios/TorrentNative/iphoneos.a
          cp ../player-torrent-native/iphonesimulator.a ios/TorrentNative/iphonesimulator.a
          ruby ../../scripts/configure-player-ios.rb
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Torrent Player' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSLocalNetworkUsageDescription string Discover torrent peers for downloading on this iPhone.' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true' ios/Runner/Info.plist
      - name: Analyze player
        timeout-minutes: 4
        working-directory: runtime/player-ios
        run: |
          rm test/widget_test.dart
          flutter analyze --no-pub
      - name: Test player lifecycle
        timeout-minutes: 4
        working-directory: runtime/player-ios
        run: flutter test --no-pub test/player_lifecycle_test.dart
      - name: Start simulator while compiling
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')"
          echo "PLAYER_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
      - name: Compile simulator
        working-directory: runtime/player-ios
        run: flutter build ios --simulator --debug
      - name: Compile unsigned iPhone app
        working-directory: runtime/player-ios
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          python3 scripts/package-player-ios.py runtime/player-ios/build/ios/iphoneos/Runner.app runtime/player-ios-kit
          cp apps/mobile/ios-player/THIRD_PARTY_NOTICES.txt runtime/player-ios-kit/
          tar -czf runtime/player-ios-kit/player-source.tar.gz apps/mobile/lib/main_player.dart apps/mobile/lib/screens/torrent_player_screen.dart apps/mobile/torrent_engine apps/mobile/ios-player scripts/build-player-torrent-ios.sh scripts/configure-player-ios.rb scripts/patch-player-flutter-test.py .github/workflows/player-ios.yml
          cd apps/mobile/torrent_engine
          go list -m all > ../../../runtime/player-ios-kit/go-dependencies.txt
          torrent_source="$(go mod download -json github.com/anacrolix/torrent | python3 -c 'import json,sys; print(json.load(sys.stdin)["Zip"])')"
          cp "$torrent_source" ../../../runtime/player-ios-kit/anacrolix-torrent-source.zip
      - name: Preserve unsigned signing kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TorrentPlayer-unsigned-signing-kit
          path: runtime/player-ios-kit/
          if-no-files-found: error
          retention-days: 7
      - name: Run embedded engine on iPhone simulator
        timeout-minutes: 20
        working-directory: runtime/player-ios
        run: |
          cd ../../apps/mobile/torrent_engine
          go build -tags 'nosqlite,disable_libutp' -o ../../../runtime/stream-fixture ./cmd/stream-fixture
          cd ../../..
          runtime/stream-fixture apps/mobile/torrent_engine/testdata/pattern.mp4 runtime/player-stream-fixture > runtime/player-stream-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            test -f runtime/player-stream-fixture/fixture.json && break
            kill -0 "$fixture_pid" || { cat runtime/player-stream-fixture.log; exit 1; }
            sleep 1
          done
          test -f runtime/player-stream-fixture/fixture.json
          cd runtime/player-ios
          xcrun simctl bootstatus "$PLAYER_SIMULATOR_ID" -b
          flutter test integration_test/standalone_test.dart -d "$PLAYER_SIMULATOR_ID" --dart-define-from-file=../player-stream-fixture/fixture.json --timeout 5m --verbose
      - name: Preserve simulator diagnostics
        if: always() && env.PLAYER_SIMULATOR_ID != ''
        timeout-minutes: 2
        run: |
          mkdir -p runtime/player-ios-simulator-diagnostics
          xcrun simctl spawn "$PLAYER_SIMULATOR_ID" log show --last 15m --style compact --predicate 'process == "Runner"' > runtime/player-ios-simulator-diagnostics/runner.log 2>&1 || true
          xcrun simctl io "$PLAYER_SIMULATOR_ID" screenshot runtime/player-ios-simulator-diagnostics/simulator.png || true
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-ios-build-evidence
          path: |
            runtime/player-ios/pubspec.lock
            runtime/player-ios/build/ios/**/*.xcresult
            runtime/player-ios-simulator-diagnostics/
            runtime/player-stream-fixture.log
          if-no-files-found: ignore
          retention-days: 7
